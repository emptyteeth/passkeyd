# The user a request belongs to is worked out from the active session on the
# physical seat (logind), so there is nothing to configure here. Each user sees
# and uses only their own passkeys, and the prompt appears in their session.
#
# GUI_UID is no longer read. passkeyd-migrate uses it once, if present, to
# decide who owns passkeys created before passkeys had owners.

RUST_LOG=info  # logging level for passkeyd

# Advanced option: The front-end UI for for passkey creation
FRONT_ENROLL=/usr/lib/passkeyd/passkeyd-ice-enroll

# Advanced option: The front-end UI for selecting a passkey
FRONT_SELECT=/usr/lib/passkeyd/passkeyd-ice-select

# Advanced option: The front-end UI for verifying the user's presence.
FRONT_SELECTION=/usr/lib/passkeyd/passkeyd-ice-selection

# There are two modes for cryptography:
# 1. TPM (Highly recommended) => Fancy math is done at the hardware level (no one can sneak in, no one can access private data)
# 2. Virtual => Fancy math is done at the software level, without hardware support.

# It is 'HIGHLY' recommended to use TPM-based cryptography.

# IMPORTANT: NON-TPM KEYS ARE NOT ENCRYPTED AND ARE EXPOSED.
# HOWEVER, they are stored with root privileges, so no one can access them without root access.

# SUPER, SUPER, REALLY IMPORTANT:
# YOU MUST HAVE TPM 2.0 IN ORDER TO USE TPM.
# You can check this with the command `ls /dev/tpm*`.
# If this returns nothing, either you don't have TPM or it isn't functioning properly.
# You might want to switch to virtual cryptography.

USE_TPM_CRYPTOGRAPHY=yes # Can either be "yes" or "no"

# The language is automatically selected based on system preferences, but can be forced to switch via this option.
# Available language options:
# bg, de, en, fr, ru, zh
# LANGUAGE=eu

# How the user proves their identity before a passkey is used.
# Available options:
#   pass   => the account password, verified directly by passkeyd (default)
#   pam    => whatever PAM service "passkeyd" is configured with
#   fprint  => a fingerprint, via fprintd. Requires an enrolled fingerprint and
#             falls back to the password whenever the reader is unavailable.
#
# "pass" is the fallback every other method degrades to, so it deliberately does
# not depend on PAM: it keeps working when the PAM stack is missing or broken.
# It enforces its own policy in place of PAM's — a lockout after 3 failures
# within 15 minutes (600s, matching pam_faillock's defaults), and refusal of
# accounts whose password or account has expired.
#
# "pam" defers all of that to your stack in /etc/pam.d/passkeyd, which is the
# right choice if you want MFA, smartcard or other modules in the chain.
# AUTH=pass

# Bypass the password if you think entering it is too much of a hassle or annoyance.
# NO_PASS=yes
