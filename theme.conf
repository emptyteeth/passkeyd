# passkeyd theme.
#
# Colours are [r, g, b, a]; each channel is 0-255. 'a' is the alpha channel.
#
# There are two ways to write this file.
#
# 1. One palette for every mode (what older versions used, still supported):
#
#      background = [36, 37, 50, 255]
#      ...
#
# 2. A palette per mode, following the desktop:
#
#      mode = "auto"          # "auto" (default) | "light" | "dark"
#      [light]
#      background = [...]
#      [dark]
#      background = [...]
#
# With two palettes, "auto" follows the desktop's colour scheme and switches
# live when it changes. Setting mode = "light" or "dark" pins one regardless of
# the desktop. A file with only one of the two sections uses it for both.
#
# A single flat palette is used as-is whatever the desktop says, so an existing
# theme.conf keeps its exact appearance after upgrading.

mode = "auto"

[light]
background = [247, 247, 251, 255]            # Page background
primary_text = [26, 27, 38, 255]             # Title and approval button text
secondary_text = [74, 76, 94, 255]           # Descriptions
surface = [238, 236, 248, 255]               # Elevated surfaces
surface_primary_text = [38, 32, 56, 255]     # Site name within elevated surfaces
surface_secondary_text = [74, 66, 96, 255]   # Site username within elevated surfaces
accent = [170, 145, 255, 255]                # Button backgrounds
scrollbar_track = [115, 115, 115, 25]        # Scrollbar background
scrollbar_thumb = [80, 80, 80, 90]           # Scrollbar handle

[dark]
background = [36, 37, 50, 255]               # Page background
primary_text = [255, 255, 255, 255]          # Title and approval button text
secondary_text = [230, 230, 230, 255]        # Descriptions
surface = [45, 40, 60, 255]                  # Elevated surfaces
surface_primary_text = [236, 217, 217, 255]  # Site name within elevated surfaces
surface_secondary_text = [236, 217, 217, 255] # Site username within elevated surfaces
accent = [160, 135, 255, 255]                # Button backgrounds
scrollbar_track = [115, 115, 115, 25]        # Scrollbar background
scrollbar_thumb = [80, 80, 80, 90]           # Scrollbar handle
